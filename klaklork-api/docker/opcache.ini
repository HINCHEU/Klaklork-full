; -------------------------------------------------------
; OPcache — accelerates PHP in production
; -------------------------------------------------------
[opcache]
opcache.enable                = 1
opcache.enable_cli            = 1
opcache.memory_consumption    = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps   = 0
opcache.save_comments         = 1
opcache.jit                   = 1255
opcache.jit_buffer_size       = 64M
; CLI processes can't share php-fpm's memory cache, so every scheduler run
; recompiled the whole framework (~1.8 s of CPU a minute). /tmp is wiped with
; the container on each deploy, so the cache never outlives the code.
opcache.file_cache            = /tmp
