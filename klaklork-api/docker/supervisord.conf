; -------------------------------------------------------
; Supervisor — keeps Octane + queue worker + Reverb + scheduler alive
; -------------------------------------------------------
[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid
user=root

; More workers than cores: a worker blocks on MySQL/Redis and on room row locks,
; so 2 would leave the CPUs idle. ~50 MB each. Binding :80 as www-data works
; because Docker sets net.ipv4.ip_unprivileged_port_start=0 in containers.
[program:octane]
user=www-data
command=/usr/local/bin/php /var/www/html/artisan octane:start --server=swoole --host=0.0.0.0 --port=80 --workers=8 --max-requests=1000
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
user=www-data
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb]
user=www-data
command=/usr/local/bin/php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
user=www-data
command=/usr/local/bin/php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
