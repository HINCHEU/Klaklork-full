; -------------------------------------------------------
; PHP-FPM pool — the image default caps it at 5 workers
; -------------------------------------------------------
; A worker uses ~40 MB, so 20 tops out near 800 MB of RAM.
[www]
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests      = 500
