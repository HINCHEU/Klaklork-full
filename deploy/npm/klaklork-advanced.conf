# Paste into NPM: Proxy Host game.hincheu.online -> Advanced tab.
# Reverb WebSockets: Echo connects to wss://<host>/app/<key>
location /app/ {
    # A variable makes nginx re-resolve, so a recreated app container doesn't 502.
    set $reverb http://klaklork-app:8080;
    proxy_pass $reverb;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
