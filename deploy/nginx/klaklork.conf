# Host nginx in front of the Docker stack — TLS terminates here.
# Installed by deploy/setup-https.sh. On first run certbot rewrites this file in
# /etc/nginx: it adds the 443 listener, the HTTP -> HTTPS 301 and HSTS.
# The containers only listen on 127.0.0.1, so this is the one public entry point.

server {
    listen 80;
    listen [::]:80;
    server_name game.hincheu.online;

    client_max_body_size 1m;

    # Reverb WebSockets: Echo connects to wss://<host>/app/<key>
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA, /api and /broadcasting — the frontend container proxies the last two to Laravel
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
